<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Practica 2 - EV2</title>
</head>
<body>

  <h2>Práctica 2</h2>
  <p>Crear una aplicación que dibuje triángulos o rectángulos.</p>

  <label>Figura:</label>
  <select id="figura">
    <option value="Triangulo">Triangulo</option>
    <option value="Rectangulo">Rectangulo</option>
  </select>
  <br><br>

  <label>Caracter:</label>
  <input type="text" id="caracter" value="*">
  <br><br>

  <div id="campoBase" style="display: none;">
    <label>Base:</label>
    <input type="number" id="base">
    <br><br>
  </div>

  <label>Altura:</label>
  <input type="number" id="altura">
  <br><br>

  <button id="btnMostrar">Mostrar</button>

  <br><br>

  <pre id="resultado"></pre>

  <script src="practica2.js"></script>

</body>
</html>
