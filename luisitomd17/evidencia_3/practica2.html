<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2</title>
</head>
<body>
<h1>Práctica 2</h1>
<p>Aplicación que dibuje triangulos o rectangulos.</p>
<form action="">
        <label for="figura">Figura:</label>
        <select name="figura" id="figura">
            <option value="Triangulo">Triangulo</option>
            <option value="Rectangulo">Rectangulo</option>
        </select>
        <br><br>

        <label for="caracter">Caracter</label>
        <input type="text" name="caracter" id="caracter" value="*" size="5">
        <br><br>

<!-- Campo Base (solo se usa en rectángulo) -->
        <div id="divBase" class="oculto">
            <label for="base">Base</label>
            <input type="text" name="base" id="base" value="3" size="5">
            <br><br>
        </div>

        <label for="altura">Altura</label>
        <input type="text" name="altura" id="altura" value="3" size="5">
        <br><br>
        <button id="btnMostrar">Mostrar</button>
    </form>

    <pre id="resultado"></pre>


    <script src="practica2.js"></script>
</body>
</html>
