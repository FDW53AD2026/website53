<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de sueldo</title>
</head>
<body>
    <h1>Calculadora de sueldo</h1>

    <form id="formularioSueldo">
        <label for="turno">Selecciona el turno:</label>
        <select id="turno" required>
            <option value="">Selecciona una opción</option>
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="nocturno">Nocturno</option>
        </select>

        <br><br>

        <label for="horas">Horas trabajadas:</label>
        <input type="number" id="horas" min="0.01" step="any" required>

        <br><br>

        <label for="pagoHora">Pago por hora ($):</label>
        <input type="number" id="pagoHora" min="0" step="any" required>

        <br><br>

        <button type="submit">Calcular sueldo</button>
    </form>

    <h2 id="resultado">Sueldo: $0.00</h2>

    <script src="sueldo.js"></script>
</body>
</html>
