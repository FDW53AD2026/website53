
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2 - Figuras</title>
</head>
<body>

    <h1>Practica 2 - Dibujar figuras</h1>
    <p>Selecciona una figura y completa los datos.</p>

    <label for="figura">Figura:</label>
    <select id="figura">
        <option value="triangulo">Triangulo</option>
        <option value="rectangulo">Rectangulo</option>
    </select>

    <br><br>

    <label for="caracter">Caracter:</label>
    <input type="text" id="caracter" value="*" maxlength="1">

    <br><br>

    <div id="campoBase" style="display: none;">
        <label for="base">Base:</label>
        <input type="number" id="base" value="5" min="1">
        <br><br>
    </div>

    <label for="altura">Altura:</label>
    <input type="number" id="altura" value="3" min="1">

    <br><br>

    <button type="button" id="mostrar">Mostrar</button>

    <h3>Resultado:</h3>
    <pre id="resultado"></pre>

    <script src="figuras.js"></script>

</body>
</html>
