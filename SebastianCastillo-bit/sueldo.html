
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de sueldo</title>
</head>
<body>

    <h2>Calculo de sueldo de un trabajador</h2>

    <label for="turno">Turno:</label>
    <select id="turno">
        <option value="diurno">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
    </select>

    <br><br>

    <label for="horas">Horas trabajadas:</label>
    <input type="number" id="horas" min="0" step="any">

    <br><br>

    <label for="pago">Pago por hora:</label>
    <input type="number" id="pago" min="0" step="any">

    <br><br>

    <label for="sueldo">Sueldo:</label>
    <input type="text" id="sueldo" readonly>

    <br><br>

    <button type="button" onclick="calcularSueldo()">Calcular</button>
    <button type="button" onclick="limpiar()">Limpiar</button>

    <script>
        function calcularSueldo() {
            let turno = document.getElementById("turno").value;
            let horasTexto = document.getElementById("horas").value;
            let pagoTexto = document.getElementById("pago").value;

            let horas = Number(horasTexto);
            let pago = Number(pagoTexto);

            if (horasTexto.trim() === "" ||
                pagoTexto.trim() === "" ||
                !Number.isFinite(horas) ||
                !Number.isFinite(pago) ||
                horas <= 0 || pago <= 0) {
                alert("Ingresa horas y pago validos");
                document.getElementById("sueldo").value = "";
                return;
            }

            if (turno === "vespertino") {
                pago = pago * 1.03;
            } else if (turno === "nocturno") {
                pago = pago * 2;
            }

            let sueldo = horas * pago;

            document.getElementById("sueldo").value =
                sueldo.toFixed(2);
        }

        function limpiar() {
            document.getElementById("turno").value = "diurno";
            document.getElementById("horas").value = "";
            document.getElementById("pago").value = "";
            document.getElementById("sueldo").value = "";
        }
    </script>

</body>
</html>
