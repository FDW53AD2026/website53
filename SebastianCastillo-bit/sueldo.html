
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de sueldo</title>
</head>
<body>

    <h2>Calculo de sueldo de un trabajador</h2>

    <label for="turno">Turno:</label>
    <select id="turno">
        <option value="diurno">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
    </select>

    <br><br>

    <label for="horas">Horas trabajadas:</label>
    <input type="number" id="horas" min="0" step="any">

    <br><br>

    <label for="pago">Pago por hora:</label>
    <input type="number" id="pago" min="0" step="any">

    <br><br>

    <label for="sueldo">Sueldo:</label>
    <input type="text" id="sueldo" readonly>

    <br><br>

    <button type="button" onclick="calcularSueldo()">Calcular</button>
    <button type="button" onclick="limpiar()">Limpiar</button>

    <script src="sueldo.js"></script>

</body>
</html>
