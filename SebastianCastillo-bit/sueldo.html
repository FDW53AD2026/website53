
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculo de sueldo</title>
</head>
<body>

    <h2>Calculo de sueldo de un trabajador</h2>

    <label>Turno:</label>
    <select id="turno">
        <option value="diurno">Diurno</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
    </select>
    <br><br>

    <label>Horas trabajadas:</label>
    <input type="number" id="horas" min="0" step="any">
    <br><br>

    <label>Pago por hora:</label>
    <input type="number" id="pago" min="0" step="any">
    <br><br>

    <label>Sueldo:</label>
    <input type="text" id="sueldo" readonly>
    <br><br>

    <button onclick="calcularSueldo()">Calcular</button>

    <script>
        function calcularSueldo() {
            let turno = document.getElementById("turno").value;
            let horas = Number(document.getElementById("horas").value);
            let pago = Number(document.getElementById("pago").value);

            if (horas <= 0 || pago <= 0) {
                alert("Ingresa horas y pago validos");
                return;
            }

            if (turno === "vespertino") {
                pago = pago * 1.03;
            } else if (turno === "nocturno") {
                pago = pago * 2;
            }

            let sueldo = horas * pago;

            document.getElementById("sueldo").value =
                sueldo.toFixed(2);
        }
    </script>

</body>
</html>
