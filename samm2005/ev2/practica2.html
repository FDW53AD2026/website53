<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area figuras</title>
    <style>
        form {
            padding: 10px;
            background-color: rgb(228, 179, 232);
            font-size:30px;
            width: 40vw;
        }
        h1 {
            font-size: 50px;
            color: rgb(126, 19, 19);
        }
        button {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>A R E A</h1>
    <form action="">
    
            <label for="figura">Figura: </label>

            </select><br>

            <label for="caracter">Caracter: </label>
            <input type="text" id="caracter"  name="caracter"><br>

            <label for="altura">Altura: </label>
            <input type="text" id="altura"  name="altura"><br>
           
            <div id="cajaBase">
            <label for="base">Base: </label>
            <input type="text" id="base"  name="base">
            </div><br>

            <button id="mostrar">Mostrar</button>

    </form>

    <h2>Resultado</h2>
    <div id="salida"> </div>

    <script src="p2.js"></script>

</html>
