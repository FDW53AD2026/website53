<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>

    <h2>Practica 2 - Dibujar figuras</h2>

    <label for="figura">Figura:</label>

    <select id="figura">
        <option value="triangulo">Triangulo</option>
        <option value="rectangulo">Rectangulo</option>
    </select><br><br>

    <label for="caracter">Caracter:</label>
    <input type="text" id="caracter" value="*" maxlength="1"><br><br>

    <div id="campoAltura">
        <label for="altura">Altura:</label>
        <input type="text" id="altura">
    </div>

    <div id="campoBase" hidden>
        <br>
        <label for="base">Base:</label>
        <input type="text" id="base">
    </div><br>

    <button id="btnMostrar" type="button">Mostrar</button><br><br>
    <pre id="resultado"></pre>

    <script src="prac2.js"></script>
