
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Práctica 1 - Sueldo</title>
</head>
<body>
    <h2>Práctica 1</h2>
    <p>Calcular el sueldo de un trabajador.</p>

    <label>Turno:</label>
    <select id="horario">
        <option value="matutino">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
    </select>
    <br><br>
    <label>Horas trabajadas:</label>
    <input type="number" id="tiempo">
    <br><br>
    <label>Pago por hora:</label>
    <input type="number" id="tarifa">
    <br><br>
    <label>Sueldo:</label>
    <input type="text" id="resultado" readonly>
    <br><br>
    <button id="btnObtener">Calcular</button>
    <script src="practica1.js"></script>
</body>
</html>
