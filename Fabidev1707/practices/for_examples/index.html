<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Calculator app</h1>
        </header>
        <main>
            <section>
                <p class="pageformat">This is a simple calculator to do simple operations.</p>
                <div class="formsect">
                    <form action="">
                        <div>
                            <label for="text">Text:</label>
                            <input type="text" id="text" name="text">
                        </div>
                        <div>
                            <label for="cicle">How many cicles?:</label>
                            <input type="text" id="cicle" name="cicle">
                        </div>

                        <div class="btnsect">
                            <button id="btnshow" name="btnshow">Show</button>
                            <button id="btnclear" name="btnclear">Clear</button>
                        </div>
                        
                        <div>
                            <label for="output">Output:</label>
                            <ul id="output"></ul>
                        </div>
                        
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
<script src="script.js"></script>
</html>
