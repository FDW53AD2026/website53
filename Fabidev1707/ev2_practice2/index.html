<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Shape maker</h1>
        </header>
        <main>
            <section>
                <p class="pageformat">This is a simple program that create a shape with a character.</p>
                <div class="formsect">
                    <form action="">
                        <div>
                            <label for="shape">Shape:</label>
                            <select name="shape" id="shape">
                                <option value="1">Triangle</option>
                                <option value="2">Rectangle</option>
                            </select>
                        </div>
                        <div>
                            <label for="character">Character:</label>
                            <input type="text" id="character" name="character">
                        </div>
                        <div>
                            <label for="height">Height:</label>
                            <input type="text" id="height" name="height">
                        </div>

                        <div class="btnsect">
                            <button id="btnshow" name="btnshow">Show</button>
                            <button id="btnclear" name="btnclear">Clear</button>
                        </div>
                        
                        <div>
                            <label for="output">Output:</label>
                            <div id="output"></div>
                        </div>
                        
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
    <footer>
        <div class="pageformat">
            <p>Pagina web by &copy;Fabidev1707</p>
        </div>
    </footer>
</body>
</html>
