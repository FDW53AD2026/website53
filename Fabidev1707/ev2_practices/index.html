<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header>
            <h1>Payment calculator</h1>
        </header>
        <main>
            <section>
                <p class="pageformat">This is a simple Payment calculator to calculate how much an employee can earn every hour depending on the shift that they do.</p>
                <div class="formsect">
                    <form action="">
                        <div>
                            <label for="shift">Shift:</label>
                            <input type="text" id="shift" name="shift">
                        </div>
                        <div>
                            <label for="hours">Hours:</label>
                            <input type="text" id="hours" name="hours">
                        </div>
                        <div>
                            <label for="pay">Pay per hour:</label>
                            <input type="text" id="pay" name="pay">
                        </div>
                        <div>
                            <label for="salary">Salary:</label>
                            <input type="text" id="salary" name="salary">
                        </div>
                        <div class="btnsect">
                            <button id="btncal" name="btncal">Calculate</button>
                            <button id="btnclear" name="btnclear">Clear</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>

    <footer>
        <div class="pageformat">
            <p>Pagina web by &copy;Fabidev1707</p>
        </div>
    </footer>
</body>
</html>
