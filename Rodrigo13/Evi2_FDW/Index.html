<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1 [Calculadora Pagó de Turno] </title>
</head>
<body>
    <link rel="stylesheet" href="Style2.css">
    <Script src ="Script2.js"></Script>
    <div class="container">
        <header>
            <h1>Calculación de pago salarial</h1>
        </header>
        <main>
            <section>
                <p class="pageformat">Calculadora de horas extras, Turno y Sueldo .</p>
                <div class="formsect">
                    <form action="">
                        <div>
                            <label for="shift">Turno:</label>
                            <input type="text" id="shift" name="shift">
                        </div>
                        <div>
                            <label for="hours">Horas:</label>
                            <input type="text" id="hours" name="hours">
                        </div>
                        <div>
                            <label for="pay">Pago por Hora:</label>
                            <input type="text" id="pay" name="pay">
                        </div>
                        <div>
                            <label for="salary">Sueldo:</label>
                            <input type="text" id="salary" name="salary">
                        </div>
                        <div class="btnsect">
                            <button id="btncal" name="btncal">Calcular</button>
                            <button id="btnclear" name="btnclear">Limpiar</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
     
    
</body>
</html>
