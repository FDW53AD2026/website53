<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1 [Calculadora Pagó de Turno] </title>
</head>
<body>
  <link rel="stylesheet" href="Style2.css">

    <h1>Calculadora de Sueldo</h1>
 
    <form action="">
 
        <label for="TURNOS">Turnos:</label>
        <input type="text" list="ListaDeTurnos" id="TURNOS" name="TURNOS" >
        
        <datalist id="ListaDeTurnos"> <br>
            <option value="Nocturno/Noche"></option>
            <option value="Vespertino/Tarde"></option>
            <option value="Matutino/Mañana"></option>
        </datalist> <br>

        <label for="HORAS">Horas:</label>
        <input type="number" name="HORAS" id="HORAS"> 
        
        <br><br>

        <label for="PAYFHOUR">Pago por Hora</label>
        <input type="number" name="PAYFHOUR" id="PAYFHOUR"> 
        
        <br><br>
        
        <label for="SUELDO">Sueldo:</label>
        <input type="text" name="SUELDO" id="SUELDO" > 
        
        <br><br>

        <button id="CALCULANDO">Calcular</button>
        <button id="LIMPIADO">Limpiar</button>

    </form>

    <Script src ="Script2.js"></Script>

</body>
</html>
