<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    
      <h1>Valores de Figuras</h1>


    <form>
        <label for="Forma">Figura:</label>
        <select id="Forma">
            <option value="Triángulo">Triángulo</option>
            <option value="Réctangulo">Rectángulo</option>
        </select> 
        
        <br><br>
        
        <label for="Caracter">Carácter</label>
        <input type="text"  id="Caracter" maxlength="1">
        
        <br><br>

        <label for="Altura">Altura</label>
        <input type="number" id="Altura" min="1">
        
        <br><br>

        <label for="Base" id="Etiqueta_Base"  hidden>Base: </label>
        <input type="number"  id="Base" min="1" hidden>
        
        <br><br>
        
        <button id="Botón_Mostrar">Mostrar</button><br>
    </form>

    <br>
    <figure id="Salida"></figure>
    
    <script src="script.js"></script>
    
</body>
</html>
