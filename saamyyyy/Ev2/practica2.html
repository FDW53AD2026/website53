<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2</title>
</head>
<body>

    <h1>Triángulos y Rectángulos</h1>
    <form action="">
        <label for="figure">Figura</label>
        <select name="figura" id="figure">
            <option value="1">Triángulo</option>
            <option value="2">Rectángulo</option>
        </select><br>

        <label for="car">Caracter</label>
        <input type="text" name="car" id="car"><br>

        <div id="divBase" style="display: none;">
            <label for="base">Base</label>
            <input type="number" name="base" id="base" min="1"><br>
        </div>

        <label for="alt">Altura</label>
        <input type="number" name="alt" id="alt" min="1"><br>

        <button type="button" id="btnMostrar">Mostrar</button>
    </form>

    <pre id="resultado"></pre>

    <script src="javascript/p2.js"></script>
</body>
</html>
