<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 1</title>
</head>
<body>
    <h1>Práctica 1</h1>
    <form>
        <label for="turno">Turno: </label>
        <select name="turno" id="turno">
            <option value="">Selecciona un turno</option>
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="nocturno">Nocturno</option>
        </select> <br>

        <label for="horas">Horas: </label>
        <input type="text" name="horas" id="horas"> <br>

        <label for="pagohora">Pago por hora:</label>
        <input type="text" name="pagohora" id="pagohora"> <br>

        <label for="sueldo">Sueldo: </label>
        <input readonly type="text" name="sueldo" id="sueldo"> <br>

        <button type="button" id="btnCalcular">Calcular</button>
        <button type="button" id="btnLimpiar">Limpiar</button>
    </form>
    <script src="p1.js"></script>
</body>
</html>
