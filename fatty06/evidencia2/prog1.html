<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de sueldo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Aplicacion para calcular el sueldo</h1>
    <form action="">
        <label for="turno">Turno (vespertino / nocturno):</label>
        <input type="text"  name="turno" id="turno"><br>

        <label for="horas">Horas trabajadas:</label>
        <input type="text" name="horas" id="horas"><br>

        <label for="pagoHora">Pago por hora:</label> 
        <input type="text" name="pagoHora" id="pagoHora"><br>

        <label for="sueldo">Sueldo:</label>
        <input readonly type="text" name="sueldo" id="sueldo"><br>

        <button type="button" id="btnCalcular">Calcular</button>
        <button type="button" id="btnLimpiar">Limpiar</button>
    </form>
    <a href="https://FDW53ad2026.github.io/website53/fatty06/evidencia2/progr1.html" 
    target="_blank">Ver programa de calculo de sueldo</a>
    <script src="./app.js"></script>
    

</body>
</html>
