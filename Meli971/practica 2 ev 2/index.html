<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2 - Figuras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: skyblue;
            padding: 20px;
        }

        .contenedor {
            background-color: white;
            max-width: 450px;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: inline-block;
            margin: 10px 0;
        }

        input, select, button {
            padding: 6px;
            margin: 5px 0;
        }

        #resultado {
            font-family: monospace;
            white-space: pre;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Práctica 2: Dibujar figuras</h2>

        <label for="figura">Figura:</label>
        <select id="figura">
            <option value="triangulo">Triángulo</option>
            <option value="rectangulo">Rectángulo</option>
        </select>

        <br>

        <label for="caracter">Carácter:</label>
        <input type="text" id="caracter" value="*" maxlength="1" required>

        <br>

        <div id="campoAltura">
            <label for="altura">Altura:</label>
            <input type="number" id="altura" value="3" min="1" max="50">
        </div>

        <div id="campoBase" hidden>
            <label for="base">Base:</label>
            <input type="number" id="base" value="5" min="1" max="50">
        </div>

        <br>
        <button id="mostrar">Mostrar</button>

        <pre id="resultado"></pre>
    </div>

    <script src="figuras.js"></script>
</body>
</html>
