<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidencia 2</title>
</head>
<body>
    <h1>Practica 1 Ev2</h1>
    <h2>Calculador de salario</h2>

    <form action="">

        <label for="turno">Turno:</label>
        <select id="turno" name="turno" required>
            <option value="" selected disabled>Selecciona un turno</option>
            <option value="matutino">Matutino</option>
            <option value="vespertino">Vespertino</option>
            <option value="nocturno">Nocturno</option>
        </select><br><br>

        <label for="horas">Horas trabajadas:</label>
        <input type="number" id="horas" name="horas" min="0" step="0.5"><br><br>

        <label for="pago">Pago por hora:</label>
        <input type="number" id="pago" name="PagoPorHora" step="0.01" required><br><br>

        <label for="sueldo">Sueldo:</label>
        <input type="number" id="sueldo" name="sueldo" step="0.01" readonly><br><br>

        <button type="button" id="calcular">Calcular</button> 
        <button type="reset">Limpiar</button> 

    </form>

    <script src="js/funcion.js"></script>

    
</body>
</html>
