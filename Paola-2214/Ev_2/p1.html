<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ev_2 Practica 1</title>
</head>
<body>

    <article>
        <h1>Calcular Sueldo</h1>
    </article>
    <form action="">
        <fieldset style="width: 300px;">
            <label for="turno">Turno</label>
            <input type="text" name="turno" id="turno"> <br> <br>
            
            <label for="horas">Horas</label>
            <input type="number" name="horas" id="horas"> <br> <br>
            
            <label for="pago">Pago por hora</label>
            <input type="number" name="pago" id="pago"> <br> <br>
            
            <label for="sueldo">Sueldo</label>
            <input readonly type="text" name="sueldo" id="sueldo"> <br> <br>
            
            <button type="button" id="btncalcular">Calcular</button>
            <button type="button" id="btnlimpiar">Limpiar</button>
        </fieldset>

    </form>
    <script src="p1.js"></script>
    
</body>
</html>
