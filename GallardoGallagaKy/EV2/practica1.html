<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calcular Sueldo</h1>

    <form action="" id="sueldoForm">
        <label for="turno">Turno:</label>
        <input type="text" name="turno" id="turno"><br>

        <label for="horas">Horas:</label>
        <input type="text" name="horas" id="horas"><br>

        <label for="pago">Pago por Hora:</label>
        <input type="text" name="pago" id="pago"><br>

        <label for="salario">Sueldo:</label>
        <input type="text" name="salario" id="salario" readonly><br>

        <button type="button" id="btnCalcular">Calcular</button>
        <button type="button" id="btnLimpiar">Limpiar</button>
    </form>

    <script src="practica1.js"></script>
</body>
</html>
