<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sueldos</title>
</head>
<body>
    <h1>Calculadora de Sueldos</h1>
    <h3>Instrucciones ingresar los datos a calcular en cada una de las casillas</h3>

    <div>Turno <input type="text" id="turno" size="30"></div>
    <div>Horas <input type="text" id="horas" size="30"></div>
    <div>Pago de Horas Trabajadas <input type="text" id="pago" size="30"></div>
    <div>Sueldo de Horas Trabajadas <input type="text" id="sueldo" size="30" readonly></div>

    <button type="button" id="btnTotal">Total</button>
    <button type="button" id="btnBorrar">Borrar</button>

    <script src="CSueldo.js"></script>
</body>
</html>
