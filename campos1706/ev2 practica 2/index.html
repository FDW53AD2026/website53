<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 10px;
        }
        form {
            display: inline-block;
            border: 1px solid #ccc;
            border-top: 8px solid #ddd;
            border-radius: 6px;
            padding: 10px 10px 20px 10px;
            min-width: 280px;
        }
        form p {
            margin: 14px 0;
            font-family: "Times New Roman", serif;
            font-size: 18px;
        }
        pre {
            margin: 10px 0 0 60px;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <form>
        <p>Figura:
            <select id="figura">
                <option value="triangulo">Triangulo</option>
                <option value="rectangulo">Rectangulo</option>
            </select>
        </p>
        <p>Caracter <input type="text" id="caracter" size="30" maxlength="1" value="*"></p>
        <p id="filaBase" style="display: none;">Base <input type="text" id="base" size="30"></p>
        <p>Altura <input type="text" id="altura" size="30"></p>
        <button type="button" id="btnMostrar">Mostrar</button>
        <pre id="resultado"></pre>
    </form>
    <script src="CFiguras.js"></script>
</body>
</html>
