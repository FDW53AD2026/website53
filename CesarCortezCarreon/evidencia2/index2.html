<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica 2 - Figuras</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Práctica 2</h1>
    <p>Crear una aplicación que dibuje triángulos o rectángulos.</p>

    <div class="contenedor">

        <div class="campo">
            <label for="figura">Figura:</label>
            <select id="figura">
                <option value="triangulo">Triángulo</option>
                <option value="rectangulo">Rectángulo</option>
            </select>
        </div>

        <div class="campo">
            <label for="caracter">Carácter:</label>
            <input type="text" id="caracter" value="*" maxlength="1">
        </div>

        <div class="campo">
            <label for="altura">Altura:</label>
            <input type="number" id="altura" value="3" min="1" max="50">
        </div>

        <div class="campo" id="campoBase" hidden>
            <label for="base">Base:</label>
            <input type="number" id="base" value="5" min="1" max="50">
        </div>

        <button type="button" id="btnMostrar">Mostrar</button>

        <pre id="resultado"></pre>

    </div>

</body>
</html>
