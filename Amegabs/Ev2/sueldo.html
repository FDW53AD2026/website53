<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueldos</title>
</head>
<body>
    <h1>Sueldos de trabajadores</h1>
<form action="sueldo">
    <label for="turno">Turno: </label>
    <input type="text" name="turno" id="turno"><br>

    <label for="horas">Horas:   </label>
    <input type="text" name="horas" id="horas"><br>

    <label for="pago">Pago por hora: </label>
    <input type="text" name="pago" id="pago"><br>

    <label for="sueldo">Sueldo: </label>
    <input type="text" name="sueldo" id="sueldo"><br>

    <button id="calcular">Calcular </button>
    <button id="limpiar">Limpiar </button>
</form>

<script src="sueldo.js"></script>
</body>
</html>
