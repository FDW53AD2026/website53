<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Figuras</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="panel-left">
            <h2>Bienvenido:D</h2>
            <p>Generador de Figuras Geométricas</p>
            <form id="shapeForm">
                <div class="form-group">
                    <label for="figura">Figura</label>
                    <select id="figura">
                        <option value="triangulo">Triángulo</option>
                        <option value="rectangulo">Rectángulo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="caracter">Carácter a utilizar</label>
                    <input type="text" id="caracter" value="*" maxlength="1">
                </div>
                <div class="form-group" id="groupBase" style="display: none;">
                    <label for="base">Base</label>
                    <input type="number" id="base" value="3" min="1">
                </div>
                <div class="form-group">
                    <label for="altura">Altura</label>
                    <input type="number" id="altura" value="3" min="1">
                </div>
                <button type="submit">Mostrar</button>
            </form>
        </div>
        <div class="panel-right">
            <pre id="output"></pre>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
