
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="practica2.css">

    <title>Practica 2</title>
</head>

<body>

    <h1>Practica 2</h1>

    <form action="">

        <label for="figura">Figura:</label>
        <select name="figura" id="figura">
            <option value="1">Triangulo</option>
            <option value="2">Rectangulo</option>
        </select>
        <br><br>

        <label for="caracter">Caracter:</label>
        <input type="text" name="caracter" id="caracter">
        <br><br>

        <label for="altura">Altura:</label>
        <input type="number" name="altura" id="altura">
        <br><br>

        <div id="cajaBase" hidden>
            <label for="base">Base:</label>
            <input type="number" name="base" id="base">
            <br><br>
        </div>

        <button type="button" id="btnMostrar">Mostrar</button>

    </form>

    <pre id="resultado"></pre>

    <script src="practica2.js"></script>

</body>
</html>
