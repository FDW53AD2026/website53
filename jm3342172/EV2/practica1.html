
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="practica1.css">

    <title>Calculo de sueldo</title>
</head>

<body>
    <h1>Sitio web para calcular el sueldo</h1>
    <h2>Por favor, ingresa los datos</h2>

    <form action="">
        <label for="turno">Turno</label>
        <input type="text" name="turno" id="turno"><br>

        <label for="horas">Horas</label>
        <input type="text" name="horas" id="horas"><br>

        <label for="pagoHora">Pago por hora</label>
        <input type="text" name="pagoHora" id="pagoHora"><br>

        <label for="sueldo">Sueldo</label>
        <input readonly type="text" name="sueldo" id="sueldo"><br>

        <button type="button" id="btnCalcular">Calcular</button>
        <button type="button" id="btnLimpiar">Limpiar</button>
    </form>

    <script src="practica1.js"></script>

    

    <footer>

</footer>

</body>
</html>
