<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h1>Calculadora de dinero</h1>
    <form action="">
        <label for="turno">Turno:</label>
        <select id="turno" name="turno" placeholder="n/a">
            <option value="Matutino">Matutino</option>
            <option value="Vespertino">Vespertino</option>
            <option value="Nocturno">Nocturno</option>
        </select> <br>

        <label for="horas">Horas:</label>
        <input type="number" name="horas" id="horas" placeholder="0"> <br>

        <label for="PxH">Pago por Hora</label>
        <input type="number" name="PxH" id="PxH" placeholder="0"> <br>

        <label for="sueldo">Sueldo:</label>
        <input type="text" name="sueldo" id="sueldo" readonly placeholder="0"> <br>

        <button id="calcular" type="button">Calcular</button>
        <button id="limpiar" type="button">Limpiar</button>

    </form>
    <script src="parte2/dinero.js"></script>
</body>
</html>
