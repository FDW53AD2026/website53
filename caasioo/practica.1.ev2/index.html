<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Práctica 1 - Sueldo de un trabajador</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #1d1d1d; }
    form { display: inline-block; padding: 1rem 1.25rem; border: 1px solid #ccc; border-radius: 6px; }
    .campo { display: flex; align-items: center; gap: .5rem; margin-bottom: .75rem; }
    .campo label { width: 8.5rem; }
    input, select { padding: .3rem .4rem; font: inherit; }
    button { padding: .4rem .9rem; font: inherit; cursor: pointer; }
    #error { color: #b00020; margin-top: .75rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <h1>Cálculo de sueldo</h1>

  <form id="formulario" novalidate>
    <div class="campo">
      <label for="turno">Turno:</label>
      <select id="turno">
        <option value="matutino">Matutino</option>
        <option value="vespertino">Vespertino</option>
        <option value="nocturno">Nocturno</option>
      </select>
    </div>
    <div class="campo">
      <label for="horas">Horas trabajadas:</label>
      <input type="number" id="horas" min="0" step="any">
    </div>
    <div class="campo">
      <label for="pago">Pago por hora:</label>
      <input type="number" id="pago" min="0" step="any">
    </div>
    <div class="campo">
      <label for="sueldo">Sueldo:</label>
      <input type="text" id="sueldo" readonly>
    </div>
    <button type="button" id="calcular">Calcular</button>
    <div id="error" role="alert"></div>
  </form>

  <script src="CSueldo.js"></script>
</body>
</html>
