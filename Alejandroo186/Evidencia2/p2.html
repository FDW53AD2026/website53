
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 2</title>
</head>
<body>
    <h1>Practica 2</h1>

    <form action="">
        <label for="Figura">Figura:</label>
        <select name="Figura" id="Figura">
            <option value="1">Triangulo</option>
            <option value="2">Rectangulo</option>
        </select><br><br>

        <label for="Caracter">Caracter</label>
        <input type="text" name="Caracter" id="Caracter" value="*"><br><br>

        <div id="divAltura">
            <label for="Altura">Altura</label>
            <input type="number" name="Altura" id="Altura" value="3" min="1">
        </div><br>

        <div id="divBase" style="display: none;">
            <label for="Base">Base</label>
            <input type="number" name="Base" id="Base" value="5" min="1">
        </div><br>

        <button id="btnMostrar">Mostrar</button>
    </form>

    <pre id="Resultado"></pre>

    <script src="figuras.js"></script>
</body>
</html>
