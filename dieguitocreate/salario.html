<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Sueldo</title>
</head>
<body>

    <div class="Calculadora">
        <div>
            <label for="turno">Turno</label>
            <input type="text" id="turno" value="matutino">
        </div>

        <div>
            <label for="horas">Horas</label>
            <input type="number" id="horas" value="1">
        </div>

        <div>
            <label for="pagoHora">Pago por Hora</label>
            <input type="number" id="pagoHora" value="5">
        </div>

        <div>
            <label for="sueldo">Sueldo</label>
            <input type="number" id="sueldo" value="5" readonly>
        </div>

        <div>
            <button class="btn-calcular" onclick="calcularSueldo()">Calcular</button>
            <button class="btn-limpiar" onclick="limpiarFormulario()">Limpiar</button>
        </div>
    </div>

    <script>
        function calcularSueldo() {
            // Obtenemos los valores de los inputs de horas y pago por hora
            let horas = parseFloat(document.getElementById('horas').value) || 0;
            let pagoHora = parseFloat(document.getElementById('pagoHora').value) || 0;
            
            // Realizamos la multiplicación
            let sueldo = horas * pagoHora;
            
            // Mostramos el resultado en el input de sueldo
            document.getElementById('sueldo').value = sueldo;
        }

        function limpiarFormulario() {
            // Limpiamos todos los campos del formulario
            document.getElementById('turno').value = '';
            document.getElementById('horas').value = '';
            document.getElementById('pagoHora').value = '';
            document.getElementById('sueldo').value = '';
        }
    </script>

</body>
</html>
