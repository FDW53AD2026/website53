<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de sueldo</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; margin-top: 40px; }
    .caja { border: 2px solid #1a2a6c; padding: 20px; width: 320px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    select, input { width: 100%; padding: 6px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="caja">
    <label for="turno">Turno</label>
    <select id="turno">
      <option value="matutino">Matutino</option>
      <option value="vespertino">Vespertino</option>
      <option value="nocturno">Nocturno</option>
    </select>
 
    <label for="horas">Horas</label>
    <input type="number" id="horas" min="0" placeholder="Horas trabajadas">
 
    <label for="pago">Pago por hora ($)</label>
    <input type="number" id="pago" value="5" min="0">
 
    <label for="sueldo">Sueldo</label>
    <input type="text" id="sueldo" readonly>
 
    <button onclick="calcular()">Calcular</button>
    <button onclick="limpiar()">Limpiar</button>
  </div>
 
  <script src="p1.js"></script>
</body>
</html>
