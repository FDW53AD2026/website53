<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sueldo</title>
</head>
<body>
    <h1>Calculadora de Sueldos EV2</h1>
    <h3>Instrucciones ingresar los datos a calcular en cada una de las casillas</h3>

    <form action="">
        <label for="Turno">Turno</label>
        <input type="text" name="Turno" id="Turno"><br>

        <label for="Horas">Horas</label>
        <input type="text" name="Horas" id="Horas"><br>

        <label for="PagoHoras">Pago de Horas Trabajadas</label>
        <input type="text" name="PagoHoras" id="PagoHoras"><br>

        <label for="Sueldo">Sueldo de Horas Trabajadas</label>
        <input readonly type="text" name="Sueldo" id="Sueldo"><br>

        <button type="button" id="btnCalcular">Total</button>
        <button type="button" id="btnLimpiar">Borrar</button>
    </form>

    <script src="CSueldo.js"></script>

</body>
</html>
